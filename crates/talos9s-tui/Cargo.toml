[package]
name = "talos9s-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Terminal UI for talos9s"

[dependencies]
talos9s-core.workspace = true
talos-rs.workspace = true

# TUI
ratatui.workspace = true
crossterm.workspace = true

# TLS (for crypto provider)
rustls.workspace = true

# Async
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true

# Error handling
color-eyre.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# Clipboard
arboard.workspace = true

# Enum names in the state file (already in the build through ratatui)
strum = { version = "0.28", features = ["derive"] }

# Kubernetes client
kube.workspace = true
k8s-openapi.workspace = true
# Raw requests through kube (LINSTOR API via the service proxy)
http = "1"
# The daily new-release check (all already in the build through kube)
hyper = "1"
hyper-util.workspace = true
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
http-body-util = "0.1"

# Serialization
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
base64.workspace = true

# Certificate parsing
x509-parser.workspace = true

# Date/time handling
chrono.workspace = true

# Home directory
dirs-next.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
